# Small sample used for local iteration and `make all`. Merged over base.yaml.
paths:
  raw: data/sample/raw
  bronze: data/sample/bronze
  silver: data/sample/silver
  gold: data/sample/gold

spark:
  driver_memory: 2g
  shuffle_partitions: 4

vector_search:
  collection_prefix: items_sample

# Keep sample evaluation output out of docs/ (docs hold full-data results only).
evaluation:
  figures_dir: data/sample/eval/figures
  report_path: data/sample/eval/EVAL_REPORT.md

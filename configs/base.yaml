# Base config. Paths are relative to the repo root.
paths:
  raw: data/raw
  bronze: data/bronze
  silver: data/silver
  gold: data/gold

spark:
  master: "local[*]"
  driver_memory: 4g
  shuffle_partitions: 8
  extra_conf:
    # Clean shuffle files of unreferenced RDDs every minute (default 30 min). Long runs like
    # the ALS sweep otherwise accumulate GBs of shuffle data in the temp dir.
    spark.cleaner.periodicGC.interval: 1min
    # Lets iterative jobs (ALS) truncate lineage so old shuffle files can be released.
    spark.checkpoint.dir: data/_checkpoints
    spark.cleaner.referenceTracking.cleanCheckpoints: "true"

ingest:
  events_files: [events.csv]
  item_properties_files: [item_properties_part1.csv, item_properties_part2.csv]
  category_tree_file: category_tree.csv

clean:
  valid_event_types: [view, addtocart, transaction]
  min_event_date: 2015-05-01
  max_event_date: 2015-10-01
  backfill_first_property_version: true

# `make sample` reads base paths.raw and writes to the sample env's paths.raw.
sample:
  visitor_fraction: 0.05
  salt: recsys-sample

# Time-based split (Phase 2). Data covers 2015-05-03 .. 2015-09-18 03:00 UTC; the partial
# last day is excluded by `end`.
split:
  train_cutoffs: [2015-07-24, 2015-08-07]
  val_start: 2015-08-21
  test_start: 2015-09-04
  end: 2015-09-18
  label_horizon_days: 14

features:
  windows_days: [7, 30]
  session_gap_minutes: 30
  event_weights: {view: 1.0, addtocart: 3.0, transaction: 5.0}
  relevance: {view: 1, addtocart: 2, transaction: 3}
  conversion_prior_views: 20
  cooccurrence_window_days: 30
  max_session_items_for_pairs: 50

# Candidate generation (Phase 3). Generated per cutoff for visitors in that cutoff's
# label window; each source keeps its top_n items per visitor.
candidates:
  # Sources to (re)generate; others already on disk are kept. Override with SOURCES=a,b.
  sources: [popular_global, popular_category, recent_items, cooccurrence, als, item2vec]
  top_n: 100
  eval_ks: [10, 20, 50, 100]
  popularity:
    window_days: 7
  category:
    top_categories: 3
    half_life_days: 14
    window_days: 7
  history:
    half_life_days: 7
  cooccurrence:
    window_days: 60
    max_session_items: 50
    min_pair_sessions: 2
    neighbors_per_item: 50
    seed_items: 20
    seed_half_life_days: 7
    salt_buckets: 0          # >0 salts the seed x neighbor join (skew experiment, Phase 9)
  item2vec:
    seed_items: 20
    seed_half_life_days: 7
    query_chunk: 2048        # user vectors scored per numpy matmul chunk
  als:
    # Chosen by the validation sweep (docs/RESULTS.md, Phase 3): rounds 1 + 2.
    rank: 128
    reg_param: 0.01
    alpha: 40.0
    max_iter: 10
    min_user_items: 2
    min_item_users: 2
    seed: 42
  als_sweep:
    rank: [32, 64]
    reg_param: [0.01, 0.1]
    alpha: [5.0, 20.0]

# Item embeddings (Phase 4): item2vec (gensim skip-gram, negative sampling) trained per
# cutoff on sessions before T. workers=1 + a deterministic hash keep reruns identical.
embeddings:
  vector_size: 64
  window: 5
  min_count: 3
  negative: 10
  ns_exponent: 0.75
  sample: 0.001
  epochs: 10
  min_session_items: 2
  seed: 42

vector_search:
  qdrant_url: http://localhost:6333
  collection_prefix: items
  hnsw_m: 16
  hnsw_ef_construct: 100
  # Qdrant brute-forces any segment smaller than this (default 10000 KB). Our ~50k x 64-dim
  # collection splits into ~2.5 MB segments, so with the default every query was an exact
  # scan. Keep it low so search (and the benchmark) actually uses the HNSW graph.
  hnsw_full_scan_threshold_kb: 10
  search_ef: 128
  upload_batch_size: 1024
  benchmark:
    split: val
    n_queries: 1000
    k: 10
    batch_size: 64
    seed: 7
    # hnsw_ef values swept for the recall/latency trade-off (similar_items, user_vector).
    ef_sweep: [4, 8, 16, 32, 64, 128]

# LightGBM LambdaRank re-ranker (Phase 5). Train on the train cutoffs, early-stop on val,
# report on test once. Only queries (visitors) with >= 1 positive candidate are trained on.
ranking:
  max_negatives_per_query: 100
  sample_salt: ranker-negatives
  top_n: 100
  eval_ks: [10, 20, 100]
  num_boost_round: 2000
  early_stopping_rounds: 100
  eval_at: 10
  lgbm:
    objective: lambdarank
    metric: ndcg
    learning_rate: 0.05
    num_leaves: 63
    min_data_in_leaf: 50
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    lambdarank_truncation_level: 30
    num_threads: 8
    seed: 42
    deterministic: true
    force_row_wise: true
    verbosity: -1

# Base config. Paths are relative to the repo root.
paths:
  raw: data/raw
  bronze: data/bronze
  silver: data/silver
  gold: data/gold

spark:
  master: "local[*]"
  driver_memory: 4g
  shuffle_partitions: 8
  extra_conf:
    # Clean shuffle files of unreferenced RDDs every minute (default 30 min). Long runs like
    # the ALS sweep otherwise accumulate GBs of shuffle data in the temp dir.
    spark.cleaner.periodicGC.interval: 1min
    # Lets iterative jobs (ALS) truncate lineage so old shuffle files can be released.
    spark.checkpoint.dir: data/_checkpoints
    spark.cleaner.referenceTracking.cleanCheckpoints: "true"

ingest:
  events_files: [events.csv]
  item_properties_files: [item_properties_part1.csv, item_properties_part2.csv]
  category_tree_file: category_tree.csv

clean:
  valid_event_types: [view, addtocart, transaction]
  min_event_date: 2015-05-01
  max_event_date: 2015-10-01
  backfill_first_property_version: true

# `make sample` reads base paths.raw and writes to the sample env's paths.raw.
sample:
  visitor_fraction: 0.05
  salt: recsys-sample

# Time-based split (Phase 2). Data covers 2015-05-03 .. 2015-09-18 03:00 UTC; the partial
# last day is excluded by `end`.
split:
  train_cutoffs: [2015-07-24, 2015-08-07]
  val_start: 2015-08-21
  test_start: 2015-09-04
  end: 2015-09-18
  label_horizon_days: 14

features:
  windows_days: [7, 30]
  session_gap_minutes: 30
  event_weights: {view: 1.0, addtocart: 3.0, transaction: 5.0}
  relevance: {view: 1, addtocart: 2, transaction: 3}
  conversion_prior_views: 20
  cooccurrence_window_days: 30
  max_session_items_for_pairs: 50

# Candidate generation (Phase 3). Generated per cutoff for visitors in that cutoff's
# label window; each source keeps its top_n items per visitor.
candidates:
  top_n: 100
  eval_ks: [10, 20, 50, 100]
  popularity:
    window_days: 7
  category:
    top_categories: 3
    half_life_days: 14
    window_days: 7
  history:
    half_life_days: 7
  cooccurrence:
    window_days: 60
    max_session_items: 50
    min_pair_sessions: 2
    neighbors_per_item: 50
    seed_items: 20
    seed_half_life_days: 7
    salt_buckets: 0          # >0 salts the seed x neighbor join (skew experiment, Phase 9)
  als:
    # Chosen by the validation sweep (docs/RESULTS.md, Phase 3): rounds 1 + 2.
    rank: 128
    reg_param: 0.01
    alpha: 40.0
    max_iter: 10
    min_user_items: 2
    min_item_users: 2
    seed: 42
  als_sweep:
    rank: [32, 64]
    reg_param: [0.01, 0.1]
    alpha: [5.0, 20.0]

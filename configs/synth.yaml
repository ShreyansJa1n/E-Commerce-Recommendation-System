# Synthetic demo data (`make demo`): no Kaggle download needed. Same schemas as Retailrocket;
# dates cover 2015-05-03 .. 2015-05-31 (see recsys.ingest.synth). Merged over base.yaml.
paths:
  raw: data/synth/raw
  bronze: data/synth/bronze
  silver: data/synth/silver
  gold: data/synth/gold

spark:
  driver_memory: 2g
  shuffle_partitions: 4

split:
  train_cutoffs: [2015-05-17]
  val_start: 2015-05-24
  test_start: 2015-05-27
  end: 2015-05-31
  label_horizon_days: 7

candidates:
  als:
    rank: 16

embeddings:
  min_count: 2

vector_search:
  collection_prefix: items_synth

evaluation:
  bootstrap_samples: 500
  figures_dir: data/synth/eval/figures
  report_path: data/synth/eval/EVAL_REPORT.md

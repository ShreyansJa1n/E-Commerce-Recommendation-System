[project]
name = "recsys"
version = "0.1.0"
description = "End-to-end product recommendation platform on Apache Spark (Retailrocket)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark==4.0.*",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "numpy>=1.26",
    "gensim>=4.3",
    "qdrant-client>=1.12",
    "lightgbm>=4.5",
    "pandas>=2.2,<3",
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "chispa>=0.10",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "types-pyyaml",
    "pandas-stubs>=3.0.5.260914",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Contract specs are a table of human-readable strings.
"src/recsys/features/contract.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyspark.*", "chispa.*", "gensim.*"]
ignore_missing_imports = true

global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: recsys-api
    static_configs:
      - targets: ["api:8000"]
  - job_name: pushgateway        # batch pipeline stages push here
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
  - job_name: qdrant
    static_configs:
      - targets: ["qdrant:6333"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

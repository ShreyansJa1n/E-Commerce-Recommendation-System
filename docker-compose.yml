# Local services. Phase 4: Qdrant. Later phases add Redis, the API, Prometheus, Grafana.
name: recsys

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "6333:6333"   # HTTP / REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  qdrant_storage:

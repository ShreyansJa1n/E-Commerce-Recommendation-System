name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # Same image as docker-compose.yml, via Google's Docker Hub mirror (shared runners hit
      # Docker Hub's anonymous pull rate limit). tests/test_qdrant.py runs against it.
      qdrant:
        image: mirror.gcr.io/qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
    env:
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Test
        run: make test
      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t recsys-api:ci .
      - name: API image smoke test
        run: |
          docker run -d --name api -p 8000:8000 recsys-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health | grep -q '"status":"degraded"'  # no Redis/snapshot in CI
